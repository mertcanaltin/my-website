name: CI

# The site auto-deploys on push. A post with broken frontmatter or a dependency
# bump that breaks the build would otherwise ship straight to production.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx tsc --noEmit
